# Production environment for the Physiotherapy Clinic platform.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# BEFORE deploying:
# 1. Copy backend/.env.example → backend/.env and set production values
# 2. Set DJANGO_SECRET_KEY to a unique random key
# 3. Set DJANGO_DEBUG=False
# 4. Set DJANGO_ALLOWED_HOSTS to your domain(s)
# 5. Set a strong POSTGRES_PASSWORD
# 6. Configure CORS_ALLOWED_ORIGINS for your frontend domain
services:
  postgres:
    ports: []  # No external access in production

  redis:
    ports: []  # No external access in production

  backend:
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "False"
    volumes: []  # No source mount in production

  frontend:
    command: node server.js
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    volumes: []  # No source mount in production

  celery-worker:
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "False"
    volumes: []

  celery-beat:
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "False"
    volumes: []
